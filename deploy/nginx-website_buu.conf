# nginx reverse proxy + HTTPS cho website_buu (KHONG can Cloudflare).
# Thay qk5.blacknull.net bang ten mien cua ban.
#
# Cai dat:
#   sudo cp deploy/nginx-website_buu.conf /etc/nginx/sites-available/website_buu
#   sudo ln -s /etc/nginx/sites-available/website_buu /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Lay chung chi HTTPS mien phi (Let's Encrypt):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d qk5.blacknull.net
#   (certbot se tu them phan ssl + tu gia han)

server {
    listen 80;
    listen [::]:80;
    server_name qk5.blacknull.net;
    # certbot can duong nay; phan con lai chuyen sang https
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name qk5.blacknull.net;

    # Hai dong nay certbot se tu dien khi chay lenh ben tren:
    ssl_certificate     /etc/letsencrypt/live/qk5.blacknull.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qk5.blacknull.net/privkey.pem;

    client_max_body_size 50m;   # cho phep upload tai lieu lon

    location / {
        proxy_pass http://127.0.0.1:18088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # quan trong: app doc header nay
        proxy_read_timeout 300s;
    }
}
